name: Update Fuel Prices

# 毎朝 06:00 JST（= UTC 21:00）に船舶燃料価格を自動更新する。
# 手動実行も可能（workflow_dispatch）。
on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = JST 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fuel-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch fuel prices (free sources)
        env:
          # 任意：EIA の無料APIキーを Secrets に登録すると高精度化（未設定でも動作）
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_prices.py

      - name: Build self-contained dashboard (zero external requests)
        run: python scripts/build_standalone.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices/data/latest.json prices/data/history.csv prices/index.html
          if git diff --staged --quiet; then
            echo "変更なし（更新スキップ）"
          else
            git commit -m "chore: update fuel prices ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
            git push
          fi
